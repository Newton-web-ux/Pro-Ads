<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro Ads · Publisher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f0;--card:#fff;--ink:#14161a;--muted:#6b7078;--line:#e3e5de;
  --accent:#0f8a6a;--accent-soft:#e0f3ec;--ok:#12805c;--ok-soft:#e3f4ed;
  --warn:#b26a00;--warn-soft:#fdf1dc;--bad:#c23b32;--bad-soft:#fbe8e6;
  --side:#10171a;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand{font-family:'Syne',sans-serif;letter-spacing:-.01em}
.mono{font-family:'DM Mono',monospace}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:#e8e9ec;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-size:20px;font-weight:800;color:#fff;padding:2px 10px 18px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block}
.brand small{font-family:'DM Sans';font-size:10px;font-weight:600;letter-spacing:.08em;color:#9aa6a3;text-transform:uppercase;margin-left:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#b9c4c1;text-decoration:none;font-weight:500}
.nav a:hover{background:#1a2427;color:#fff}
.nav a.on{background:#212f33;color:#fff}
.nav svg{width:17px;height:17px;flex:none}
.side .spacer{flex:1}
.who{border-top:1px solid #212f33;padding:14px 10px 4px;font-size:12px;color:#9aa6a3}
.who b{display:block;color:#fff;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who a{color:#9aa6a3;cursor:pointer;text-decoration:underline}
.swap{display:block;margin:6px 0 2px;color:#8fe3c8!important}
main{padding:28px 34px 60px;max-width:1280px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:26px;font-weight:700}
.head p{color:var(--muted);margin-top:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;margin-top:6px;letter-spacing:-.02em}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;font-weight:600;transition:.15s}
.btn:hover{border-color:#c6c9c0;background:#fafbf8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;text-transform:capitalize}
.b-active,.b-paid{background:var(--ok-soft);color:var(--ok)}
.b-paused,.b-pending{background:var(--warn-soft);color:var(--warn)}
.b-rejected{background:var(--bad-soft);color:var(--bad)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid #eff0ea;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:'DM Mono',monospace;font-size:13px}
.tw{overflow-x:auto}
.name b{display:block;font-weight:600}
.name span{color:var(--muted);font-size:12px}
.empty{text-align:center;padding:42px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label{display:block;font-size:12px;font-weight:600;color:#3d4148;margin-bottom:5px}
.f{margin-bottom:14px}
.f small{color:var(--muted);font-size:11px;float:right;font-weight:400}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chartbox{height:280px;position:relative}
.note{background:var(--accent-soft);color:#0b6a50;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}

.overlay{position:fixed;inset:0;background:rgba(16,23,26,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{max-width:680px}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.mh h2{font-size:18px}
.mb{padding:22px}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
pre.code{background:#10171a;color:#d7efe6;padding:16px;border-radius:10px;overflow:auto;font-family:'DM Mono',monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:in .2s}
.toast.err{background:var(--bad)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;width:100%;max-width:400px}
.auth h1{font-size:26px;margin:6px 0 4px}
.auth p.sub{color:var(--muted);margin-bottom:22px}
.auth .brand{color:var(--ink);padding:0 0 10px}
.auth .or{text-align:center;color:var(--muted);font-size:12px;margin:14px 0}
.auth .sw{text-align:center;margin-top:16px;color:var(--muted)}
.auth .sw a{color:var(--accent);cursor:pointer;font-weight:600}
.err-line{color:var(--bad);font-size:12px;min-height:18px;margin-bottom:8px}
.skel{height:92px;border-radius:12px;background:linear-gradient(90deg,#e9ebe4 25%,#f4f5f0 50%,#e9ebe4 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px}
  .brand{padding:0 10px 0 4px}.who,.side .spacer{display:none}
  .nav{display:flex;gap:2px;flex-wrap:wrap}
  main{padding:20px 16px 50px}
  .pgrid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>

<div id="auth" class="auth hidden"></div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><i></i>Pro Ads <small>Publisher</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
  </aside>
  <main id="view"></main>
</div>

<div id="modal"></div>
<div id="toasts"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* =====================================================================
   CONFIG — fill these in (same values as advertiser.html)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyCpxW6vMzAcDor8LbPv7pH4WH7NKMGL8Ls",
  authDomain: "pro-ads-4ffce.firebaseapp.com",
  projectId: "pro-ads-4ffce",
  storageBucket: "pro-ads-4ffce.firebasestorage.app",
  messagingSenderId: "644579940361",
  appId: "1:644579940361:web:38133781b69657b8ad80d8"
};
  gasUrl:   'https://script.google.com/macros/s/AKfycbx2_ze9Bm5zb09ygy28MAsi3rfaB5yV7ka7PVWyLR_OOmXUhwNKsyAmhuuFw_xI3W1yBg/exec',
  currency: 'INR',
  advertiserUrl: 'advertiser.html',
  adsScriptUrl: new URL('proads.js', location.href).href     // where proads.js is hosted
};

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = {
  n: v => new Intl.NumberFormat('en-IN', { notation: v >= 1e6 ? 'compact' : 'standard', maximumFractionDigits: 1 }).format(v || 0),
  m: (v, d = 2) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: CONFIG.currency, minimumFractionDigits: d, maximumFractionDigits: d }).format(v || 0),
  p: v => (v || 0).toFixed(2) + '%',
  d: s => { const d = new Date(s); return isNaN(d) ? '—' : d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
};
const ctr = (c, i) => i ? c / i * 100 : 0;
const SIZES = ['300x250', '728x90', '320x50', '160x600', '300x600'];
const CATEGORIES = ['any', 'technology', 'education', 'finance', 'lifestyle', 'gaming', 'news', 'health'];
const METHODS = { upi: 'UPI', bank: 'Bank transfer', paypal: 'PayPal' };

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3800);
}

async function api(action, payload = {}) {
  const user = firebase.auth().currentUser;
  if (!user) throw new Error('Not signed in');
  const token = await user.getIdToken();
  const res = await fetch(CONFIG.gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token, ...payload })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Request failed');
  return j.data;
}

/* =====================================================================
   STATE
   ===================================================================== */
const S = {
  authMode: 'signin', pendingName: '',
  user: null, cfg: { minPayout: 500, revShare: .7 },
  view: 'overview', days: 14, metric: 'earnings',
  units: [], stats: null, payouts: [], draft: null, busy: false
};
let chart = null;

/* =====================================================================
   AUTH
   ===================================================================== */
firebase.initializeApp(CONFIG.firebase);
const auth = firebase.auth();

function renderAuth(err = '') {
  const up = S.authMode === 'signup';
  $('#auth').innerHTML = `
    <div class="box">
      <div class="brand"><i></i>Pro Ads <small>Publisher</small></div>
      <h1>${up ? 'Start earning' : 'Welcome back'}</h1>
      <p class="sub">${up ? 'Monetize your site with a single line of code.' : 'Sign in to view your earnings.'}</p>
      <form id="authForm" autocomplete="on">
        ${up ? `<div class="f"><label>Full name</label><input type="text" name="name" required autocomplete="name"></div>` : ''}
        <div class="f"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
        <div class="f"><label>Password</label><input type="password" name="password" required minlength="6" autocomplete="${up ? 'new-password' : 'current-password'}"></div>
        <div class="err-line">${esc(err)}</div>
        <button class="btn pri" style="width:100%" type="submit">${up ? 'Create account' : 'Sign in'}</button>
      </form>
      <div class="or">or</div>
      <button class="btn" style="width:100%" data-action="google">Continue with Google</button>
      <div class="sw">
        ${up ? 'Already have an account? <a data-action="authmode" data-mode="signin">Sign in</a>'
             : 'New here? <a data-action="authmode" data-mode="signup">Create an account</a> · <a data-action="reset">Forgot password</a>'}
      </div>
    </div>`;
}
const friendly = e => ({
  'auth/invalid-credential': 'Incorrect email or password.',
  'auth/user-not-found': 'No account found for that email.',
  'auth/wrong-password': 'Incorrect email or password.',
  'auth/email-already-in-use': 'An account with that email already exists.',
  'auth/weak-password': 'Password must be at least 6 characters.',
  'auth/popup-closed-by-user': 'Sign-in was cancelled.'
}[e.code] || e.message);

auth.onAuthStateChanged(async u => {
  if (!u) {
    S.user = null;
    $('#app').classList.add('hidden');
    $('#auth').classList.remove('hidden');
    renderAuth();
    return;
  }
  try {
    const r = await api('init', { name: S.pendingName || u.displayName || '' });
    S.user = r.user; S.cfg = r.config || S.cfg;
    $('#auth').classList.add('hidden');
    $('#app').classList.remove('hidden');
    route();
    await refresh();
  } catch (e) {
    toast(e.message, 'err');
    auth.signOut();
  }
});

/* =====================================================================
   DATA
   ===================================================================== */
async function refresh(silent = false) {
  if (!silent) { S.busy = true; render(); }
  try {
    const [units, stats, payouts] = await Promise.all([
      api('pub.units'), api('pub.stats', { days: S.days }), api('pub.payouts')
    ]);
    S.units = units; S.stats = stats; S.payouts = payouts;
    S.user.earnings = stats.balance;
  } catch (e) { toast(e.message, 'err'); }
  S.busy = false;
  render();
}

/* =====================================================================
   VIEWS
   ===================================================================== */
const ICONS = {
  overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>',
  units: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/></svg>',
  payouts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg>'
};
const NAV = [['overview', 'Overview'], ['units', 'Ad units'], ['payouts', 'Payouts']];

function route() {
  const h = location.hash.replace('#', '');
  S.view = NAV.some(n => n[0] === h) ? h : 'overview';
  render();
}
window.addEventListener('hashchange', route);

function render() {
  if (!S.user) return;
  $('#nav').innerHTML = NAV.map(([k, l]) => `<a href="#${k}" class="${S.view === k ? 'on' : ''}">${ICONS[k]}${l}</a>`).join('');
  $('#who').innerHTML = `<b>${esc(S.user.name)}</b>${esc(S.user.email)}
    <a class="swap" href="${CONFIG.advertiserUrl}">Switch to Advertiser →</a>
    <a data-action="logout">Sign out</a>`;
  const v = $('#view');
  if (S.busy && !S.stats) { v.innerHTML = `<div class="grid kpis">${'<div class="skel"></div>'.repeat(4)}</div><div class="skel" style="height:300px"></div>`; return; }
  v.innerHTML = ({ overview: vOverview, units: vUnits, payouts: vPayouts })[S.view]();
  if (S.view === 'overview') drawChart();
}

function vOverview() {
  const st = S.stats; if (!st) return '';
  const t = st.totals, c = ctr(t.clicks, t.impressions), rpm = t.impressions ? t.earnings / t.impressions * 1000 : 0;
  const top = S.units.map(u => ({ ...u, p: st.byUnit[u.id] || { impressions: 0, clicks: 0, earnings: 0 } }))
    .sort((a, b) => b.p.earnings - a.p.earnings).slice(0, 5);
  return `
  <div class="head">
    <div><h1>Overview</h1><p>Your ad revenue and delivery across all units.</p></div>
    <div class="row">
      ${[7, 14, 30, 90].map(d => `<button class="chip ${S.days === d ? 'on' : ''}" data-action="range" data-days="${d}">${d}d</button>`).join('')}
      <button class="btn pri" data-action="newunit">+ New ad unit</button>
    </div>
  </div>
  <div class="grid kpis">
    <div class="card kpi"><div class="l">Available</div><div class="v">${fmt.m(st.balance)}</div><div class="s"><a href="#payouts" style="color:var(--accent);font-weight:600;text-decoration:none">Request payout</a></div></div>
    <div class="card kpi"><div class="l">Earnings</div><div class="v">${fmt.m(t.earnings)}</div><div class="s">Last ${S.days} days</div></div>
    <div class="card kpi"><div class="l">Impressions</div><div class="v">${fmt.n(t.impressions)}</div><div class="s">RPM ${fmt.m(rpm)}</div></div>
    <div class="card kpi"><div class="l">Clicks</div><div class="v">${fmt.n(t.clicks)}</div><div class="s">${S.units.length} active unit${S.units.length === 1 ? '' : 's'}</div></div>
    <div class="card kpi"><div class="l">CTR</div><div class="v">${fmt.p(c)}</div><div class="s">Clicks / impressions</div></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h3 style="margin:0">Trend</h3>
      <div class="row">${['earnings', 'impressions', 'clicks'].map(m => `<button class="chip ${S.metric === m ? 'on' : ''}" data-action="metric" data-m="${m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</div>
    </div>
    <div class="chartbox"><canvas id="chart"></canvas></div>
  </div>
  <div class="card">
    <h3>Top ad units <span style="color:var(--muted);font-weight:400">· by earnings, last ${S.days} days</span></h3>
    ${top.length ? `<div class="tw"><table>
      <thead><tr><th>Ad unit</th><th>Status</th><th class="num">Earnings</th><th class="num">Impr.</th><th class="num">Clicks</th><th class="num">CTR</th></tr></thead>
      <tbody>${top.map(u => `<tr>
        <td class="name"><b>${esc(u.name)}</b><span>${esc(u.domain)} · ${esc(u.size)}</span></td>
        <td><span class="badge b-${u.status}">${u.status}</span></td>
        <td class="num">${fmt.m(u.p.earnings)}</td><td class="num">${fmt.n(u.p.impressions)}</td>
        <td class="num">${fmt.n(u.p.clicks)}</td><td class="num">${fmt.p(ctr(u.p.clicks, u.p.impressions))}</td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="empty"><b>No ad units yet</b>Create an ad unit and paste its tag on your site to start earning.</div>`}
  </div>`;
}

function drawChart() {
  const el = $('#chart'); if (!el || !S.stats) return;
  if (chart) chart.destroy();
  const s = S.stats.series, m = S.metric, isMoney = m === 'earnings';
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  chart = new Chart(el, {
    type: isMoney ? 'line' : 'bar',
    data: {
      labels: s.map(x => x.date.slice(5)),
      datasets: [{
        label: m, data: s.map(x => x[m]),
        borderColor: accent, backgroundColor: isMoney ? accent + '18' : accent + 'bb',
        fill: isMoney, tension: .35, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, borderRadius: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => isMoney ? fmt.m(c.parsed.y) : fmt.n(c.parsed.y) } } },
      scales: {
        x: { grid: { display: false }, ticks: { maxTicksLimit: 10, font: { family: 'DM Mono', size: 11 } } },
        y: { beginAtZero: true, grid: { color: '#e9ebe4' }, ticks: { font: { family: 'DM Mono', size: 11 }, callback: v => isMoney ? fmt.m(v, 0) : fmt.n(v) } }
      }
    }
  });
}

function vUnits() {
  const st = S.stats || { byUnit: {} };
  return `
  <div class="head">
    <div><h1>Ad units</h1><p>Each unit is a placement on your site with its own tag.</p></div>
    <button class="btn pri" data-action="newunit">+ New ad unit</button>
  </div>
  <div class="card">
    ${S.units.length ? `<div class="tw"><table>
      <thead><tr><th>Ad unit</th><th>Status</th><th>Size</th><th>Category</th><th class="num">Earnings</th><th class="num">Impr.</th><th class="num">CTR</th><th></th></tr></thead>
      <tbody>${S.units.map(u => {
        const p = st.byUnit[u.id] || { impressions: 0, clicks: 0, earnings: 0 };
        return `<tr>
        <td class="name"><b>${esc(u.name)}</b><span>${esc(u.domain)} · <span class="mono">${esc(u.id)}</span></span></td>
        <td><span class="badge b-${u.status}">${u.status}</span></td>
        <td class="mono" style="font-size:13px">${esc(u.size)}</td>
        <td style="text-transform:capitalize">${esc(u.category)}</td>
        <td class="num">${fmt.m(p.earnings)}</td><td class="num">${fmt.n(p.impressions)}</td><td class="num">${fmt.p(ctr(p.clicks, p.impressions))}</td>
        <td style="white-space:nowrap;text-align:right">
          <button class="btn sm" data-action="tag" data-id="${u.id}">Get tag</button>
          <button class="btn sm" data-action="toggleunit" data-id="${u.id}" data-to="${u.status === 'active' ? 'paused' : 'active'}">${u.status === 'active' ? 'Pause' : 'Resume'}</button>
          <button class="btn sm" data-action="editunit" data-id="${u.id}">Edit</button>
          <button class="btn sm danger" data-action="archiveunit" data-id="${u.id}">Remove</button>
        </td></tr>`;
      }).join('')}</tbody></table></div>`
      : `<div class="empty"><b>No ad units yet</b>Click “New ad unit” to create your first placement.</div>`}
  </div>`;
}

function vPayouts() {
  const st = S.stats || { balance: 0, paid: 0, pending: 0 };
  const min = S.cfg.minPayout, can = st.balance >= min;
  return `
  <div class="head"><div><h1>Payouts</h1><p>You earn ${Math.round(S.cfg.revShare * 100)}% of every ad dollar served on your units. Minimum payout ${fmt.m(min, 0)}.</p></div></div>
  <div class="grid kpis">
    <div class="card kpi"><div class="l">Available</div><div class="v">${fmt.m(st.balance)}</div></div>
    <div class="card kpi"><div class="l">Pending</div><div class="v">${fmt.m(st.pending)}</div></div>
    <div class="card kpi"><div class="l">Paid out</div><div class="v">${fmt.m(st.paid)}</div></div>
  </div>
  <div class="grid pgrid" style="grid-template-columns:minmax(260px,360px) 1fr;align-items:start">
    <div class="card">
      <h3>Request payout</h3>
      ${can ? '' : `<div class="note">You need at least ${fmt.m(min, 0)} available to request a payout.</div>`}
      <form id="payoutForm">
        <div class="f"><label>Amount (${CONFIG.currency})</label><input type="number" name="amount" id="pamount" min="${min}" max="${Math.floor(st.balance)}" step="1" value="${can ? Math.floor(st.balance) : ''}" ${can ? '' : 'disabled'} required></div>
        <div class="f"><label>Method</label><select name="method" ${can ? '' : 'disabled'}>${Object.entries(METHODS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
        <div class="f"><label>UPI ID / account details</label><input type="text" name="account" maxlength="120" placeholder="name@bank or account + IFSC" ${can ? '' : 'disabled'} required></div>
        <button class="btn pri" style="width:100%" type="submit" ${can ? '' : 'disabled'}>Request payout</button>
      </form>
    </div>
    <div class="card">
      <h3>Payout history</h3>
      ${S.payouts.length ? `<div class="tw"><table><thead><tr><th>Requested</th><th>Method</th><th>Status</th><th class="num">Amount</th></tr></thead>
      <tbody>${S.payouts.map(p => `<tr><td>${fmt.d(p.ts)}</td><td>${esc(METHODS[p.method] || p.method)}</td><td><span class="badge b-${p.status}">${p.status}</span></td><td class="num">${fmt.m(p.amount)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty"><b>No payouts yet</b>Requests will appear here.</div>`}
    </div>
  </div>`;
}

/* =====================================================================
   AD UNIT EDITOR + TAG
   ===================================================================== */
function openUnit(id) {
  const u = id ? S.units.find(x => x.id === id) : null;
  S.draft = u ? { ...u } : { name: '', domain: '', size: '300x250', category: 'any' };
  const d = S.draft, opt = (arr, v) => arr.map(x => `<option value="${x}" ${x === v ? 'selected' : ''}>${x}</option>`).join('');
  $('#modal').innerHTML = `
  <div class="overlay"><div class="modal" role="dialog" aria-modal="true">
    <div class="mh"><h2>${u ? 'Edit ad unit' : 'New ad unit'}</h2><button class="x" data-action="close" aria-label="Close">×</button></div>
    <div class="mb">
      <div class="f"><label>Unit name</label><input type="text" data-field="name" maxlength="60" value="${esc(d.name)}" placeholder="Blog sidebar"></div>
      <div class="f"><label>Website domain</label><input type="text" data-field="domain" maxlength="100" value="${esc(d.domain)}" placeholder="example.com"></div>
      <div class="cols2">
        <div class="f"><label>Ad size</label><select data-field="size">${opt(SIZES, d.size)}</select></div>
        <div class="f"><label>Content category</label><select data-field="category">${opt(CATEGORIES, d.category)}</select></div>
      </div>
    </div>
    <div class="mf"><button class="btn" data-action="close">Cancel</button><button class="btn pri" data-action="saveunit">${u ? 'Save changes' : 'Create unit'}</button></div>
  </div></div>`;
}
function tagCode(u) {
  return `<div id="proad-${u.id}"></div>\n<script async src="${CONFIG.adsScriptUrl}" data-unit="${u.id}" data-api="${CONFIG.gasUrl}"><\/script>`;
}
function openTag(id) {
  const u = S.units.find(x => x.id === id); if (!u) return;
  S.draft = { _tag: tagCode(u) };
  $('#modal').innerHTML = `
  <div class="overlay"><div class="modal wide" role="dialog" aria-modal="true">
    <div class="mh"><h2>Ad tag · ${esc(u.name)}</h2><button class="x" data-action="close" aria-label="Close">×</button></div>
    <div class="mb">
      <p style="color:var(--muted);margin-bottom:12px">Paste this where the ${esc(u.size)} ad should appear on <b style="color:var(--ink)">${esc(u.domain)}</b>. Impressions are counted once the ad is at least 50% visible for one second.</p>
      <pre class="code">${esc(S.draft._tag)}</pre>
    </div>
    <div class="mf"><button class="btn" data-action="close">Close</button><button class="btn pri" data-action="copytag">Copy code</button></div>
  </div></div>`;
}
function closeModal() { $('#modal').innerHTML = ''; S.draft = null; }

/* =====================================================================
   EVENTS (delegated)
   ===================================================================== */
const actions = {
  authmode: t => { S.authMode = t.dataset.mode; renderAuth(); },
  google: async () => { try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch (e) { renderAuth(friendly(e)); } },
  reset: async () => {
    const email = prompt('Enter your account email:'); if (!email) return;
    try { await auth.sendPasswordResetEmail(email.trim()); toast('Password reset email sent.'); } catch (e) { toast(friendly(e), 'err'); }
  },
  logout: () => auth.signOut(),
  range: async t => { S.days = +t.dataset.days; await refresh(true); },
  metric: t => { S.metric = t.dataset.m; render(); },
  newunit: () => openUnit(),
  editunit: t => openUnit(t.dataset.id),
  tag: t => openTag(t.dataset.id),
  close: closeModal,
  copytag: async t => {
    try { await navigator.clipboard.writeText(S.draft._tag); t.textContent = 'Copied ✓'; setTimeout(() => t.textContent = 'Copy code', 1800); }
    catch { toast('Copy failed — select the code and copy manually.', 'err'); }
  },
  toggleunit: async t => {
    try { await api('pub.unitStatus', { id: t.dataset.id, status: t.dataset.to }); toast(t.dataset.to === 'active' ? 'Ad unit resumed.' : 'Ad unit paused.'); await refresh(true); }
    catch (e) { toast(e.message, 'err'); }
  },
  archiveunit: async t => {
    if (!confirm('Remove this ad unit? Its tag will stop serving ads. Earnings history is kept.')) return;
    try { await api('pub.archiveUnit', { id: t.dataset.id }); toast('Ad unit removed.'); await refresh(true); }
    catch (e) { toast(e.message, 'err'); }
  },
  saveunit: async t => {
    const d = S.draft;
    if (!d.name.trim()) return toast('Enter a unit name.', 'err');
    if (!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(d.domain.trim().replace(/^https?:\/\//i, '').replace(/\/.*$/, ''))) return toast('Enter a valid domain, e.g. example.com', 'err');
    t.disabled = true; t.textContent = 'Saving…';
    try { await api('pub.saveUnit', { unit: d }); closeModal(); toast('Ad unit saved.'); await refresh(true); }
    catch (e) { toast(e.message, 'err'); t.disabled = false; t.textContent = 'Save'; }
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (t && actions[t.dataset.action]) { e.preventDefault(); actions[t.dataset.action](t); return; }
  if (e.target.classList.contains('overlay')) closeModal();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.field && S.draft) S.draft[t.dataset.field] = t.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.draft) closeModal(); });
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button[type=submit]');
  if (f.id === 'authForm') {
    const d = Object.fromEntries(new FormData(f));
    btn.disabled = true;
    try {
      if (S.authMode === 'signup') {
        S.pendingName = d.name.trim();
        const cred = await auth.createUserWithEmailAndPassword(d.email.trim(), d.password);
        await cred.user.updateProfile({ displayName: S.pendingName });
      } else await auth.signInWithEmailAndPassword(d.email.trim(), d.password);
    } catch (er) { renderAuth(friendly(er)); }
  }
  if (f.id === 'payoutForm') {
    const d = Object.fromEntries(new FormData(f));
    btn.disabled = true;
    try {
      await api('pub.requestPayout', { amount: Number(d.amount), method: d.method, account: d.account.trim() });
      toast('Payout requested.'); await refresh(true);
    } catch (er) { toast(er.message, 'err'); btn.disabled = false; }
  }
});
</script>
</body>
</html>
